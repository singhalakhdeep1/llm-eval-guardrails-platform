version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: llm_eval
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "58123:8123"
      - "59000:9000"
