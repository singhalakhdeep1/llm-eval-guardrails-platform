name: LLM Eval Guardrails CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run backend unit tests
        env:
          LLM_EVAL_PROJECT_ROOT: ${{ github.workspace }}
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run dataset smoke flow
        env:
          LLM_EVAL_PROJECT_ROOT: ${{ github.workspace }}
        run: python scripts/run_dataset_smoke.py

      - name: Start API for load test
        env:
          LLM_EVAL_PROJECT_ROOT: ${{ github.workspace }}
        run: python -m uvicorn app.main:app --host 0.0.0.0 --port 8100 &

      - name: Wait for API health
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://localhost:8100/health"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if 200 <= response.status < 400:
                          raise SystemExit(0)
              except (urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(1)
          raise SystemExit("API did not become healthy in time")
          PY

      - name: Run load test
        run: python ../../ops/loadtest/run_load_test.py

      - name: Upload load test artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-guardrails-loadtest-report
          path: ops/loadtest/loadtest_report.json
          if-no-files-found: error

      - name: Validate SLO thresholds
        run: python ../../ops/perf/validate_slo.py

      - name: Upload SLO validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-guardrails-slo-validation-report
          path: ops/perf/slo_validation_report.json
          if-no-files-found: error
