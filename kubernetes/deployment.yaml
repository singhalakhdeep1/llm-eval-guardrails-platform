# Kubernetes deployment for llm-eval-guardrails-platform

apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-eval-api
  labels:
    app: llm-eval-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llm-eval-api
  template:
    metadata:
      labels:
        app: llm-eval-api
    spec:
      containers:
      - name: api
        image: llm-eval-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: LANGSMITH_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-eval-secrets
              key: langsmith-api-key
        - name: ARIZE_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-eval-secrets
              key: arize-api-key
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        - name: REDIS_HOST
          value: "redis"
        - name: PGVECTOR_HOST
          value: "pgvector"
        - name: CLICKHOUSE_HOST
          value: "clickhouse"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: llm-eval-api
spec:
  selector:
    app: llm-eval-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
